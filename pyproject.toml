[project]
name = "internal-liquidity"
version = "0.1.0"
description = "Simulation code for the internal liquidity model"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
